name: imsi-2026

services: 
  database:
    image: postgres:18-alpine
    environment:
      PGUSER: ${PGUSER}
      PG: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE}      
    volumes:
      - postgres_data:/var/lib/postgres 
    networks:
      - imsi-2026 
    healthcheck:
      test: 
      - CMD-SHELL
      - pg_isready -U $${PGUSER} -d $${PGDATABASE}
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    

  backend:
    build:
      context: .
      target: backend 
    image: imsi-backend:1.0
    environment:
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGHOST: database
      PGDATABASE: ${PGDATABASE}
      PGPORT: ${PGPORT}
    networks:
      - imsi-2026
    ports:
      - "3000:3000"
    healthcheck:
      test: 
       - CMD-SHELL
       - wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      target: frontend
    image: imsi-frontend:1.0
    networks:
      - imsi-2026
    ports:
      - "5173:5173"
    healthcheck:
      test: 
       - CMD-SHELL
       - wget --no-verbose --tries=1 --spider http://localhost:5173/ || exit 1
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped 

volumes:
  postgres_data:

networks:
  imsi-2026: